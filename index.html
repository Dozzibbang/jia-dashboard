<style>
:root{
  --ink:#2D2438;
  --muted:#7A6C8C;
  --line:#EFE4FF;
  --panel:#FFFFFF;
  --shadow:0 12px 30px rgba(124,77,255,.11);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(circle at 6% 2%, #F6EEFF 0, rgba(246,238,255,0) 44%),
    radial-gradient(circle at 97% 6%, #FFE9F5 0, rgba(255,233,245,0) 40%),
    radial-gradient(circle at 50% 108%, #E4D8FF 0, rgba(228,216,255,0) 48%),
    linear-gradient(180deg,#F7F2FF 0%,#EDE4FF 100%);
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
input,textarea{user-select:text;-webkit-user-select:text}
button{font-family:var(--font)}
h2{margin:0}

#app{
  position:fixed;top:0;right:0;bottom:0;left:0;inset:0;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ===== 상단 바 ===== */
.topbar{flex:0 0 auto;height:104px;display:flex;align-items:center;gap:14px;padding:10px 24px 0}
.hello{flex:1 1 auto;min-width:0}
.hello .hi{font-size:27px;font-weight:800;letter-spacing:-.6px;display:flex;align-items:center;gap:8px;line-height:1.15}
.hello .emo{font-size:23px}
.hello .dt{font-size:14.5px;font-weight:700;color:#786894;margin-top:5px;letter-spacing:-.1px}
.clockbox{flex:0 0 auto;padding:0 4px}
.clockline{display:flex;align-items:baseline;gap:6px;justify-content:center}
.ampm{font-size:17px;font-weight:800;color:#7C4DFF}
#clockHM{font-size:54px;font-weight:800;letter-spacing:-2.5px;font-variant-numeric:tabular-nums;line-height:.95;color:#2D2438}
.sec{font-size:15px;font-weight:800;color:#B6A6D6;font-variant-numeric:tabular-nums}

.badge{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  min-width:318px;min-height:74px;padding:10px 18px;border-radius:22px;
  background:#fff;border:2px solid #E4D6FF;box-shadow:0 10px 24px rgba(124,77,255,.13);
  transition:background .3s,border-color .3s;
}
.badge .b-ico{font-size:26px;line-height:1}
.badge .b-txt{min-width:0}
.badge .b-label{font-size:11.5px;font-weight:800;color:#7C6B99;letter-spacing:.2px}
.badge .b-title{font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:232px}
.badge .b-sub{font-size:13px;font-weight:800;color:#6236FF;margin-top:2px}
.badge.is-active{background:linear-gradient(150deg,#F7F1FF,#EEE2FF);border-color:#C7AEFF}
.badge.is-active .b-sub{color:#6236FF}
.badge.is-free{background:linear-gradient(150deg,#F4FFF9,#E2FAF1);border-color:#BFEBD9}
.badge.is-free .b-sub{color:#2E9E78}

/* ===== 메인 ===== */
.main{flex:1 1 auto;min-height:0;display:flex;gap:16px;padding:12px 20px 8px}
.panel{min-width:0;background:rgba(255,255,255,.9);border-radius:26px;border:1.5px solid #E7DAFE;box-shadow:var(--shadow)}
.left{flex:1.7 1 0;display:flex;flex-direction:column;padding:8px 12px 12px}
.right{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px}

/* 좌측 헤더 */
.lhead{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:2px 4px 9px}
.lhead h2{font-size:17px;font-weight:800;letter-spacing:-.4px}
.wrange{font-size:11.5px;font-weight:800;color:#8474A0;padding-top:3px}
.seg{margin-left:auto;display:flex;background:#F1EAFF;border-radius:13px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:10px;font-size:13.5px;font-weight:800;color:#8B7BA6;cursor:pointer;letter-spacing:-.2px;transition:background .2s,color .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 3px 9px rgba(124,77,255,.16)}
.iconbtn{flex:0 0 auto;width:36px;height:36px;border-radius:11px;border:1.5px solid #EADDFB;background:#fff;font-size:15px;cursor:pointer;line-height:1;padding:0}

/* 오늘 메모 */
.notebar{flex:0 0 auto;display:none;align-items:center;gap:8px;margin:0 4px 9px;padding:9px 13px;border-radius:14px;background:#F6EEFF;border:1.5px dashed #C9B3FF;font-size:13.5px;font-weight:800;color:#6E4BC8;cursor:pointer;letter-spacing:-.2px}
.notebar.show{display:flex}
.notebar .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 주간 시간표 */
.week{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.daycol{min-width:0;display:flex;flex-direction:column;background:#FBF8FF;border-radius:16px;padding:5px;border:1.5px solid #F0E7FD}
.dayhead{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:3px;padding:4px 0 5px;border-radius:11px;background:var(--soft);color:#6B5A86;font-size:12.5px;font-weight:800;letter-spacing:-.2px}
.dayhead .dnum{font-size:10.5px;opacity:.72;font-weight:800}
.daycol.is-today{border-color:var(--acc);background:#fff;box-shadow:0 10px 22px rgba(124,77,255,.2)}
.daycol.is-today .dayhead{background:var(--acc);color:#2D2438}
.daycol.is-today .dayhead .dnum{opacity:.7}
.daybody{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:6px;padding:6px 0 2px;scrollbar-width:none}
.daybody::-webkit-scrollbar{display:none}

.ev{
  flex:0 0 auto;display:flex;flex-direction:column;gap:1px;text-align:left;
  padding:6px 6px 6px 7px;border-radius:11px;background:#fff;overflow:hidden;
  border:1.5px solid #EEE4FC;border-left:4px solid var(--acc);
  box-shadow:0 2px 5px rgba(124,77,255,.06);
  cursor:pointer;line-height:1.15;width:100%;
}
.ev-time{font-size:9.5px;font-weight:800;color:#806D9B;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-title{font-size:12.5px;font-weight:800;color:var(--ink);letter-spacing:-.4px;word-break:keep-all}
.ev-memo{font-size:9.5px;font-weight:700;color:#7E6D96;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.oneoff{background:#FCF8FF;border-style:dashed}
.ev.skipped{opacity:.45}
.ev.skipped .ev-title{text-decoration:line-through}
.tag{display:inline-block;align-self:flex-start;font-size:9px;font-weight:800;padding:1px 5px;border-radius:7px;margin-top:2px;letter-spacing:-.2px}
.tag.one{background:#FFE6F2;color:#C2307F}
.tag.skip{background:#F0ECF6;color:#87789B}
.addbtn{flex:0 0 auto;border:1.5px dashed #DFCFF8;background:transparent;border-radius:11px;padding:7px 0;font-size:15px;color:#B4A0DC;cursor:pointer;line-height:1}
.addbtn:active{background:#F4ECFF}

/* 오늘 보기 */
.today-list{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 4px 4px;scrollbar-width:none}
.today-list::-webkit-scrollbar{display:none}
.trow{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:17px;background:#fff;border:1.5px solid #EDE3FB;border-left:7px solid var(--acc,#B79BFF);cursor:pointer}
.trow.now{background:linear-gradient(120deg,#FCF8FF,#F1E8FF);border-color:#CBB2FF;box-shadow:0 8px 20px rgba(124,77,255,.16)}
.trow.past{opacity:.55}
.t-time{flex:0 0 auto;width:74px;font-weight:800;font-size:15px;color:#80699F;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.t-end{display:block;font-size:10.5px;color:#9481B0;font-weight:800;letter-spacing:-.2px}
.t-main{flex:1 1 auto;min-width:0}
.t-title{font-size:17px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.t-memo{font-size:12.5px;font-weight:700;color:#87769F;margin-top:3px}
.pill{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:9px;white-space:nowrap}
.pill.now{background:#FFE1F0;color:#C1307F}
.pill.past{background:#F2EDF8;color:#7B6D92}
.pill.soon{background:#DEF7EC;color:#2E9E78}
.skipped-line{flex:0 0 auto;font-size:12.5px;font-weight:800;color:#7E6E96;padding:8px 12px;border-radius:13px;background:#F7F2FE}
.tempty{flex:0 0 auto;text-align:center;padding:34px 10px;color:#8C7BA8;font-size:15px;font-weight:800;line-height:1.6}
.taddrow{flex:0 0 auto;border:1.5px dashed #DFCFF8;background:transparent;border-radius:15px;padding:12px 0;font-size:14px;font-weight:800;color:#B09BD6;cursor:pointer}

/* ===== 캐릭터 카드 ===== */
.petcard{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 12px;border-radius:24px;background:linear-gradient(155deg,#FBF7FF 0%,#F3ECFF 48%,#FFEEF7 100%);border:1.5px solid #E4D6FF;box-shadow:0 12px 26px rgba(124,77,255,.14)}
.petart{flex:0 0 auto;width:104px;height:104px}
.petart svg{width:100%;height:100%;display:block}
.petart img{width:100%;height:100%;display:block;object-fit:contain;animation:bob 3.4s ease-in-out infinite}
.petinfo{flex:1 1 auto;min-width:0}
.petrow{display:flex;align-items:center;gap:8px}
.petname{font-size:17px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.starwrap{margin-left:auto;font-size:12.5px;font-weight:800;color:#6236FF;background:#EFE6FF;padding:3px 9px;border-radius:10px;white-space:nowrap}
.starwrap b{font-size:15px}
.petmsg{font-size:12px;font-weight:700;color:#7C6A97;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;border-radius:7px;background:#EFE6FB;overflow:hidden;margin:8px 0 5px}
.bar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#C9B3FF,#7C4DFF);transition:width .55s cubic-bezier(.3,1.2,.5,1)}
.petnext{font-size:11.5px;font-weight:800;color:#7C6A97}

/* ===== 오늘 할 일 ===== */
.todopanel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:12px 14px 12px;border-radius:24px;background:rgba(255,255,255,.94);border:1.5px solid #E7DAFE;box-shadow:var(--shadow)}
.thead{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin-bottom:9px;padding:0 2px}
.thead h2{font-size:17px;font-weight:800;letter-spacing:-.4px}
.prog{margin-left:auto;font-size:13px;font-weight:800;color:#6236FF;background:#F1E8FF;padding:4px 11px;border-radius:14px}
#todoList{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:1px 2px 1px 0;scrollbar-width:none}
#todoList::-webkit-scrollbar{display:none}
.todo{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:6px 8px 6px 7px;border-radius:17px;background:#fff;border:1.5px solid #EFE6FB;min-height:58px;transition:background .25s,border-color .25s}
.todo.done{background:#FAF5FF;border-color:#DFCEFF}
.check{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:3px solid #EBDDFB;background:#fff;font-size:21px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .13s,background .2s,border-color .2s,box-shadow .2s}
.check:active{transform:scale(.9)}
.todo.done .check{background:linear-gradient(150deg,#C9B3FF,#7C4DFF);border-color:#8E6BFF;color:#fff;box-shadow:0 6px 15px rgba(124,77,255,.35);animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.todo-text{flex:1 1 auto;font-size:17px;font-weight:800;letter-spacing:-.4px;word-break:keep-all;line-height:1.25}
.todo.done .todo-text{color:#B4A2CC;text-decoration:line-through;text-decoration-thickness:2px}
.todo-del{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:0;background:#F6F0FF;color:#B7A6D2;font-size:12px;cursor:pointer;padding:0;line-height:1;transition:width .15s,background .2s,color .2s}
.todo-del.armed{width:52px;border-radius:12px;background:#FFE0EE;color:#C2307F;font-size:11px;font-weight:800}
.addrow-wrap{flex:0 0 auto;display:flex;gap:7px;margin-top:10px}
#todoInput{flex:1 1 auto;min-width:0;height:46px;border-radius:14px;border:1.5px solid #E8DCFA;background:#FDFAFF;padding:0 13px;font-size:15px;font-family:var(--font);font-weight:700;color:var(--ink)}
#todoInput::placeholder{color:#B9A7D0;font-weight:700}
#todoInput:focus{outline:none;border-color:#A98BFF;background:#fff}
.btnp{flex:0 0 auto;height:46px;padding:0 17px;border-radius:14px;border:0;background:linear-gradient(150deg,#A98BFF,#6236FF);color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 6px 14px rgba(124,77,255,.32)}
.btnp:active{transform:scale(.97)}
.tfoot{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin-top:9px;padding:0 2px}
.mini{margin-left:auto;font-size:12px;font-weight:800;color:#8672A8}

/* ===== 하단 ===== */
.bottombar{flex:0 0 auto;height:46px;display:flex;align-items:center;gap:8px;padding:0 24px 6px}
.foot-note{flex:1 1 auto;font-size:11.5px;font-weight:700;color:#7A6A93;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghostbtn{flex:0 0 auto;height:32px;padding:0 12px;border-radius:11px;border:1.5px solid #E6D9FB;background:rgba(255,255,255,.85);color:#7A6A94;font-size:12px;font-weight:800;cursor:pointer}
.ghostbtn.danger{color:#C05C86;border-color:#F6D8E6}
.ghostbtn.armed{background:#FFE3F0;border-color:#F3B6D2;color:#C2307F}

/* ===== 모달 ===== */
.modal-back{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(45,36,56,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:40;padding:24px}
.modal-back.show{display:flex}
.modal{width:440px;max-width:100%;max-height:88vh;overflow-y:auto;background:#fff;border-radius:26px;padding:20px 22px 18px;box-shadow:0 26px 60px rgba(64,40,110,.28);animation:sheetIn .22s ease-out}
.m-head{display:flex;align-items:center;gap:10px}
.m-head h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.5px}
.m-x{margin-left:auto;width:32px;height:32px;border-radius:50%;border:0;background:#F5EFFF;color:#A28FC0;font-size:13px;cursor:pointer}
.m-sub{font-size:12.5px;font-weight:800;color:#83719E;margin:3px 0 12px}
.f{display:block;margin-bottom:11px}
.f>span{display:block;font-size:12px;font-weight:800;color:#83719E;margin-bottom:5px}
.f input,.f textarea{width:100%;border-radius:13px;border:1.5px solid #E6D9FA;background:#FDFAFF;padding:11px 12px;font-size:16px;font-family:var(--font);font-weight:700;color:var(--ink)}
.f textarea{resize:none;line-height:1.45}
.f input:focus,.f textarea:focus{outline:none;border-color:#A98BFF;background:#fff}
.f-row{display:flex;gap:10px}
.f-row .f{flex:1 1 0}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:#7A6A94;margin:2px 0 10px;padding:9px 11px;border-radius:12px;background:#F9F4FF}
.chk input{width:20px;height:20px;accent-color:#7C4DFF}
.m-actions{display:flex;gap:8px;margin-top:6px}
.btn{height:46px;padding:0 16px;border-radius:14px;border:0;font-size:15px;font-weight:800;cursor:pointer}
.btn.primary{flex:1 1 auto;background:linear-gradient(150deg,#A98BFF,#6236FF);color:#fff;box-shadow:0 8px 18px rgba(124,77,255,.32)}
.btn.ghost{background:#F5EFFF;color:#7A6A94}
.btn.danger{background:#FFE7F1;color:#C2307F}

/* ===== 축하 / 효과 ===== */
#party{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;pointer-events:none;background:rgba(248,243,255,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#party.show{display:flex;pointer-events:auto}
.party-card{position:relative;width:420px;max-width:88vw;text-align:center;background:#fff;border-radius:30px;padding:22px 24px 20px;box-shadow:0 30px 70px rgba(90,60,150,.3);border:3px solid #E2D3FF;animation:popIn .35s cubic-bezier(.3,1.5,.5,1)}
.party-pet{width:150px;height:150px;margin:0 auto}
.party-pet svg{width:100%;height:100%;display:block}
.party-pet img{width:100%;height:100%;display:block;object-fit:contain;animation:bob 3.4s ease-in-out infinite}
.party-title{font-size:23px;font-weight:800;letter-spacing:-.7px;margin-top:6px;color:#6236FF}
.party-sub{font-size:14px;font-weight:800;color:#8E7CAA;margin-top:6px;line-height:1.5}
.party-card .btn{margin-top:16px;width:100%}
.confetti{position:absolute;width:10px;height:14px;border-radius:3px;top:-20px;animation:fall 1.9s linear forwards;opacity:.95}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.spark{position:fixed;font-size:17px;animation:sparkfly .9s ease-out forwards;pointer-events:none}
#toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,14px);background:rgba(45,36,56,.94);color:#fff;font-size:13.5px;font-weight:800;padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80}
#toast.show{opacity:1;transform:translate(-50%,0)}

#storeWarn{display:none;position:fixed;top:0;left:0;right:0;z-index:90;background:#F1E7FF;color:#5B3FB0;font-size:12px;font-weight:800;text-align:center;padding:7px 10px;letter-spacing:-.2px}
body.no-store #storeWarn{display:block}
body.no-store #app{padding-top:calc(env(safe-area-inset-top) + 30px)}

@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes popIn{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes sheetIn{0%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sparkfly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.35);opacity:0}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(124,77,255,.45)}100%{box-shadow:0 0 0 14px rgba(124,77,255,0)}}
.pet-bob{animation:bob 3.4s ease-in-out infinite}
.trow.now .pill.now{animation:ring 1.8s ease-out infinite}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="hello">
      <div class="hi"><span id="greet">안녕, 지아!</span><span class="emo" id="greetEmo">🌷</span></div>
      <div class="dt" id="dateLine">오늘</div>
    </div>
    <div class="clockbox">
      <div class="clockline">
        <span class="ampm" id="ampm">오전</span><span id="clockHM">9:00</span><span class="sec" id="clockS">00</span>
      </div>
    </div>
    <div class="badge" id="nextBadge"></div>
  </header>

  <main class="main">
    <section class="panel left">
      <div class="lhead">
        <h2>시간표</h2>
        <span class="wrange" id="weekRange"></span>
        <div class="seg">
          <button data-seg="week" id="segWeek" class="on">주간</button>
          <button data-seg="today" id="segToday">오늘</button>
        </div>
        <button class="iconbtn" id="btnNote" title="오늘 메모" aria-label="오늘 메모">📌</button>
      </div>
      <div class="notebar" id="noteBar"><span>📌</span><span class="nt" id="noteText"></span></div>
      <div class="week" id="weekGrid"></div>
      <div class="today-list" id="todayList" hidden></div>
    </section>

    <section class="right">
      <div class="petcard">
        <div class="petart" id="petArt"></div>
        <div class="petinfo">
          <div class="petrow">
            <span class="petname" id="petName">알</span>
            <span class="starwrap">⭐ <b id="starCount">0</b></span>
          </div>
          <div class="petmsg" id="petMsg">별을 모으면 자라나요</div>
          <div class="bar"><i id="petBar"></i></div>
          <div class="petnext" id="petNext">다음 진화까지 별 5개</div>
        </div>
      </div>

      <div class="todopanel">
        <div class="thead">
          <h2>오늘 할 일</h2>
          <span class="prog" id="todoProgress">0 / 5</span>
        </div>
        <div id="todoList"></div>
        <div class="addrow-wrap">
          <input id="todoInput" type="text" placeholder="할 일을 적어 봐" maxlength="40" autocomplete="off">
          <button class="btnp" id="btnAddTodo">추가</button>
        </div>
        <div class="tfoot">
          <button class="ghostbtn" id="btnResetToday">오늘 초기화</button>
          <span class="mini" id="starToday">오늘 +0 ⭐</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="bottombar">
    <span class="foot-note">이 화면은 이 아이패드에만 저장돼요 · Safari 공유 → 홈 화면에 추가</span>
    <button class="ghostbtn" id="btnExport">백업 저장</button>
    <button class="ghostbtn" id="btnImport">백업 불러오기</button>
    <button class="ghostbtn danger" id="btnRestore">기본값 복원</button>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </footer>
</div>

<div class="modal-back" id="modalBack"><div class="modal" id="modalBox"></div></div>
<div id="storeWarn">이 화면에서는 기록이 저장되지 않아요 · Safari 주소로 열면 저장돼요</div>
<div id="party"></div>
<div id="fx"></div>
<div id="toast"></div>
<noscript><div style="position:fixed;inset:0;display:grid;place-items:center;font-family:sans-serif;font-size:18px;font-weight:700;color:#7A6A94;background:#F5F0FF">자바스크립트를 켜야 대시보드가 움직여요.</div></noscript>

<script>
(function(){
'use strict';

/* ================= 기본 데이터 ================= */
var DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
var DAY_LABEL = {mon:'월',tue:'화',wed:'수',thu:'목',fri:'금',sat:'토',sun:'일'};
var DAY_FULL = {mon:'월요일',tue:'화요일',wed:'수요일',thu:'목요일',fri:'금요일',sat:'토요일',sun:'일요일'};
var ACCENT = {mon:'#A98BFF',tue:'#FF9DC6',wed:'#7FD9C4',thu:'#9C7BFF',fri:'#FF78B4',sat:'#F2C86B',sun:'#9DB4FF'};
var SOFT = {mon:'#EFE8FF',tue:'#FFEAF3',wed:'#E4FAF3',thu:'#E9E1FF',fri:'#FFE7F1',sat:'#FFF6DE',sun:'#EAF0FF'};
var STORE = 'jia-dashboard-v1';
var EX_DATE = '2026-11-19';

var DEFAULT = {
  v: 1,
  schedule: {
    mon: [
      {id:'m1', start:'07:50', end:'08:30', title:'아침 러닝', memo:'가볍게 30분'},
      {id:'m2', start:'15:00', end:'18:00', title:'필즈 1관', memo:'class 2'},
      {id:'m3', start:'19:30', end:'',      title:'테니스',   memo:''}
    ],
    tue: [
      {id:'t1', start:'17:40', end:'20:40', title:'아이엔', memo:''}
    ],
    wed: [
      {id:'w1', start:'16:20', end:'18:10', title:'논술화랑', memo:'2층 마티스'}
    ],
    thu: [

/* ================= 도구 함수 ================= */
function $(sel){ return document.querySelector(sel); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayDate(){ var n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function dayKeyOf(d){ return DAY_KEYS[(d.getDay()+6)%7]; }
function parseHM(s){
  if(!s) return null;
  var p=String(s).split(':');
  if(p.length<2) return null;
  var h=parseInt(p[0],10), m=parseInt(p[1],10);
  if(isNaN(h)||isNaN(m)) return null;
  return h*60+m;
}
function fmtClock(hm){
  var m=parseHM(hm);
  if(m===null) return '';
  var h=Math.floor(m/60), mm=m%60;
  var ap=h<12?'오전':'오후';
  var h12=h%12===0?12:h%12;
  return ap+' '+h12+':'+pad(mm);
}
function fmtLeft(min){
  min=Math.max(0,Math.round(min));
  if(min<1) return '곧!';
  var h=Math.floor(min/60), m=min%60;
  if(h>0) return h+'시간'+(m>0?' '+m+'분':'');
  return m+'분';
}
function nowMinutes(){
  var n=new Date();
  return n.getHours()*60+n.getMinutes()+n.getSeconds()/60;
}
function esc(s){
  return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){
    if(c==='&') return '&amp;';
    if(c==='<') return '&lt;';
    if(c==='>') return '&gt;';
    if(c==='"') return '&quot;';
    return '&#39;';
  });
}
function fmtDateLong(d){
  return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAY_FULL[dayKeyOf(d)];
}

/* ================= 상태 ================= */
var state = loadState();

function fresh(){
  var s = JSON.parse(JSON.stringify(DEFAULT));
  s.lastDay = dateKey(todayDate());
  return s;
}
function cleanItem(it){
  return {
    id: it && it.id ? String(it.id) : uid(),
    start: it && it.start ? String(it.start) : '',
    end: it && it.end ? String(it.end) : '',
    title: String(it && it.title ? it.title : '일정').slice(0,24),
    memo: String(it && it.memo ? it.memo : '').slice(0,30),
    skip: it && Array.isArray(it.skip) ? it.skip.slice(0) : [],
    date: it && typeof it.date === 'string' ? it.date : ''
  };
}
function normalize(raw){
  var base = JSON.parse(JSON.stringify(DEFAULT));
  var src = (raw && typeof raw === 'object') ? raw : {};
  var out = base;
  if(src.schedule && typeof src.schedule === 'object'){
    DAY_KEYS.forEach(function(k){
      var arr = Array.isArray(src.schedule[k]) ? src.schedule[k] : [];
      out.schedule[k] = arr.filter(function(x){ return x && typeof x === 'object'; }).map(cleanItem);
    });
  }
  if(Array.isArray(src.todos)){
    out.todos = src.todos.filter(function(t){ return t && typeof t.text === 'string'; }).map(function(t){
      return {id: t.id ? String(t.id) : uid(), text: String(t.text).slice(0,40), done: !!t.done};
    });
  }
  if(!out.todos.length) out.todos = JSON.parse(JSON.stringify(DEFAULT.todos));
  out.stars = Math.max(0, parseInt(src.stars,10) || 0);
  out.starsToday = Math.max(0, parseInt(src.starsToday,10) || 0);
  out.lastDay = typeof src.lastDay === 'string' ? src.lastDay : dateKey(todayDate());
  out.notes = (src.notes && typeof src.notes === 'object') ? src.notes : {};
  out.view = (src.view === 'today') ? 'today' : 'week';
  return out;
}
function loadState(){
  try{
    var raw = localStorage.getItem(STORE);
    if(raw) return normalize(JSON.parse(raw));
  }catch(e){}
  return fresh();
}
function save(){
  try{
    localStorage.setItem(STORE, JSON.stringify(state));
  }catch(e){
    toast('저장 공간이 부족해서 저장을 못 했어요');
  }
}
function storageOK(){
  try{
    localStorage.setItem('__jia_test__', '1');
    localStorage.removeItem('__jia_test__');
    return true;
  }catch(e){
    return false;
  }
}

/* 하루가 바뀌면 체크를 새로 시작한다 (누적 별은 그대로) */
function rollover(){
  var t = dateKey(todayDate());
  if(state.lastDay === t) return false;
  state.todos.forEach(function(x){ x.done = false; });
  state.starsToday = 0;
  state.lastDay = t;
  DAY_KEYS.forEach(function(k){
    state.schedule[k] = state.schedule[k].filter(function(it){
      return !it.date || it.date >= t;
    });
  });
  save();
  return true;
}

/* ================= 시간표 데이터 ================= */
function isSkipped(it, ds){
  if(it.date) return false;
  return (it.skip || []).indexOf(ds) !== -1;
}
function eventsFor(dayKey, ds){
  var arr = (state.schedule[dayKey] || []).filter(function(it){
    if(it.date) return it.date === ds;
    return true;
  });
  arr.sort(function(a,b){
    var x = parseHM(a.start);
    var y = parseHM(b.start);
    return (x===null?9999:x) - (y===null?9999:y);
  });
  return arr;
}
function findItem(dayKey, id){
  var arr = state.schedule[dayKey] || [];
  for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i]; }
  return null;
}
function weekDates(){
  var t = todayDate();
  var offset = (t.getDay()+6)%7;
  var mon = new Date(t.getFullYear(), t.getMonth(), t.getDate()-offset);
  return DAY_KEYS.map(function(k,i){
    return new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+i);
  });
}

/* ================= 그리기 ================= */
function renderAll(){
  renderHeader();
  renderWeek();
  renderToday();
  renderNote();
  renderSeg();
  renderTodos();
  renderPet();
  renderBadge();
}

function renderHeader(){
  var d = new Date();
  $('#dateLine').textContent = d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAY_FULL[dayKeyOf(d)];
  var h = d.getHours();
  var g = '안녕, 지아!'; var e = '🌷';
  if(h<5){ g='아직 늦은 밤이야'; e='🌙'; }
  else if(h<10){ g='좋은 아침이야!'; e='🌞'; }
  else if(h<12){ g='안녕, 지아!'; e='🌷'; }
  else if(h<17){ g='오늘도 화이팅!'; e='🍀'; }
  else if(h<21){ g='오늘 하루 어땠어?'; e='🌈'; }
  else { g='오늘도 수고했어!'; e='✨'; }
  $('#greet').textContent = g;
  $('#greetEmo').textContent = e;
  updateClock();
}

function updateClock(){
  var d = new Date();
  var h = d.getHours();
  $('#ampm').textContent = h<12 ? '오전' : '오후';
  var h12 = h%12===0 ? 12 : h%12;
  $('#clockHM').textContent = h12+':'+pad(d.getMinutes());
  $('#clockS').textContent = pad(d.getSeconds());
}

function renderSeg(){
  var w = $('#weekGrid'), t = $('#todayList');
  if(state.view === 'today'){
    t.hidden = false; w.style.display = 'none';
    $('#segToday').classList.add('on'); $('#segWeek').classList.remove('on');
  } else {
    t.hidden = true; w.style.display = '';
    $('#segWeek').classList.add('on'); $('#segToday').classList.remove('on');
  }
}

function chipHTML(it, k, ds, isToday){
  var skipped = isToday && isSkipped(it, ds);
  var cls = 'ev' + (it.date ? ' oneoff' : '') + (skipped ? ' skipped' : '');
  var tag = '';
  if(it.date) tag = '<span class="tag one">오늘만</span>';
  else if(skipped) tag = '<span class="tag skip">오늘 쉼</span>';
  var timeTxt = esc(it.start) + (it.end ? '~'+esc(it.end) : '');
  return '<button class="'+cls+'" data-ev="'+esc(it.id)+'" data-day="'+k+'" data-date="'+ds+'">'
    + '<span class="ev-time">'+timeTxt+'</span>'
    + '<span class="ev-title">'+esc(it.title || '일정')+'</span>'
    + (it.memo ? '<span class="ev-memo">'+esc(it.memo)+'</span>' : '')
    + tag
    + '</button>';
}

function renderWeek(){
  var dates = weekDates();
  var tk = dateKey(todayDate());
  var html = '';
  for(var i=0;i<7;i++){
    var k = DAY_KEYS[i];
    var d = dates[i];
    var ds = dateKey(d);
    var isToday = (ds === tk);
    var evs = eventsFor(k, ds);
    if(isToday){
      evs = evs.slice().sort(function(a,b){
        var sa = isSkipped(a, ds) ? 1 : 0, sb = isSkipped(b, ds) ? 1 : 0;
        if(sa !== sb) return sa - sb;
        var x = parseHM(a.start), y = parseHM(b.start);
        return (x===null?9999:x) - (y===null?9999:y);
      });
    }
    var chips = evs.map(function(it){ return chipHTML(it, k, ds, isToday); }).join('');
    html += '<div class="daycol'+(isToday?' is-today':'')+'" data-accent="'+k+'" style="--acc:'+ACCENT[k]+';--soft:'+SOFT[k]+'">'
      + '<div class="dayhead"><span>'+DAY_LABEL[k]+'</span><span class="dnum">'+d.getDate()+'</span></div>'
      + '<div class="daybody">'+chips
      + '<button class="addbtn" data-add="'+k+'" data-date="'+ds+'" aria-label="일정 추가">＋</button>'
      + '</div></div>';
  }
  $('#weekGrid').innerHTML = html;
  $('#weekRange').textContent = (dates[0].getMonth()+1)+'/'+dates[0].getDate()+' ~ '+(dates[6].getMonth()+1)+'/'+dates[6].getDate();
}

function renderToday(){
  var el = $('#todayList');
  var k = dayKeyOf(todayDate());
  var ds = dateKey(todayDate());
  el.style.setProperty('--acc', ACCENT[k]);
  var all = eventsFor(k, ds);
  var live = all.filter(function(it){ return !isSkipped(it, ds); });
  var skipped = all.filter(function(it){ return isSkipped(it, ds); });
  var now = nowMinutes();
  var html = '';

  if(!live.length){
    html += '<div class="tempty">오늘은 학원이 없어!<br>신나는 하루 보내 🎉</div>';
  }

  live.forEach(function(it){
    var s = parseHM(it.start);
    var e = parseHM(it.end);
    var start = (s===null? 0 : s);
    var end = (e===null? start+60 : e);
    var cls = ''; var pill = '';
    if(now >= start && now < end){ cls=' now'; pill='<span class="pill now">지금</span>'; }
    else if(now >= end){ cls=' past'; pill='<span class="pill past">끝났어</span>'; }
    else if(start - now <= 60){ pill='<span class="pill soon">곧 시작</span>'; }

    html += '<div class="trow'+cls+'" data-ev="'+esc(it.id)+'" data-day="'+k+'" data-date="'+ds+'">'
      + '<div class="t-time">'+esc(it.start || '--:--')
      + (it.end ? '<span class="t-end">~'+esc(it.end)+'</span>' : '')
      + '</div>'
      + '<div class="t-main"><div class="t-title">'+esc(it.title || '일정')
      + (it.date ? '<span class="tag one">오늘만</span>' : '')
      + '</div>'
      + (it.memo ? '<div class="t-memo">'+esc(it.memo)+'</div>' : '')
      + '</div>'
      + '<div>'+pill+'</div>'
      + '</div>';
  });

  if(skipped.length){
    var names = skipped.map(function(it){ return esc(it.title); }).join(' · ');
    html += '<div class="skipped-line">오늘은 쉬어요 · '+names+'</div>';
  }

  html += '<button class="taddrow" data-add="'+k+'" data-date="'+ds+'">＋ 오늘 일정 추가</button>';
  el.innerHTML = html;
}

function renderNote(){
  var ds = dateKey(todayDate());
  var txt = state.notes[ds] || '';
  var bar = $('#noteBar');
  if(txt){
    bar.classList.add('show');
    $('#noteText').textContent = txt;
  } else {
    bar.classList.remove('show');
    $('#noteText').textContent = '';
  }
}

function renderTodos(){
  var el = $('#todoList');
  if(!state.todos.length){
    el.innerHTML = '<div class="tempty" style="padding:20px 8px;font-size:14px">할 일을 하나 적어 볼까?</div>';
  } else {
    el.innerHTML = state.todos.map(function(t){
      return '<div class="todo'+(t.done?' done':'')+'" data-todo-id="'+esc(t.id)+'">'
        + '<button class="check" data-check="'+esc(t.id)+'" aria-label="완료 표시">'+(t.done ? '💜' : '')+'</button>'
        + '<span class="todo-text">'+esc(t.text)+'</span>'
        + '<button class="todo-del" data-todo-del="'+esc(t.id)+'" aria-label="삭제">✕</button>'
        + '</div>';
    }).join('');
  }
  var done = state.todos.filter(function(t){ return t.done; }).length;
  $('#todoProgress').textContent = done + ' / ' + state.todos.length;
  $('#starToday').textContent = '오늘 +' + state.starsToday + ' ⭐';
}

function stageInfo(stars){
  var idx = 0;
  for(var i=0;i<EVO.length;i++){ if(stars >= EVO[i].min) idx = i; }
  return {index: idx, name: EVO[idx].name, min: EVO[idx].min, cheer: EVO[idx].cheer};
}

function renderPet(){
  var st = stageInfo(state.stars);
  if($('#petArt').getAttribute('data-stage') !== String(st.index)){
    $('#petArt').innerHTML = '<img class="petimg" src="' + PET_IMG[st.index] + '" alt="' + esc(st.name) + '">';
    $('#petArt').setAttribute('data-stage', String(st.index));
  }
  $('#petName').textContent = st.name;
  $('#petMsg').textContent = st.cheer;
  $('#starCount').textContent = state.stars;

  var next = EVO[st.index+1];
  if(next){
    var from = st.min, to = next.min;
    var pct = Math.max(0, Math.min(100, (state.stars - from) / (to - from) * 100));
    $('#petBar').style.width = pct + '%';
    $('#petNext').textContent = '다음 진화까지 별 ' + (to - state.stars) + '개';
  } else {
    $('#petBar').style.width = '100%';
    $('#petNext').textContent = '최고 단계! 별 ' + state.stars + '개 모았어';
  }
}

function badgeInner(label, title, sub, ico){
  return '<div class="b-ico">'+ico+'</div><div class="b-txt">'
    + '<div class="b-label">'+esc(label)+'</div>'
    + '<div class="b-title">'+esc(title)+'</div>'
    + '<div class="b-sub">'+esc(sub)+'</div></div>';
}

function tomorrowFirst(){
  var t = todayDate();
  t.setDate(t.getDate()+1);
  var k = dayKeyOf(t), ds = dateKey(t);
  var arr = eventsFor(k, ds).filter(function(it){ return !isSkipped(it, ds); });
  return arr.length ? arr[0] : null;
}

function renderBadge(){
  var el = $('#nextBadge');
  var k = dayKeyOf(todayDate());
  var ds = dateKey(todayDate());
  var items = eventsFor(k, ds).filter(function(it){ return !isSkipped(it, ds); });
  var now = nowMinutes();
  var active = null, next = null;

  for(var i=0;i<items.length;i++){
    var it = items[i];
    var s = parseHM(it.start);
    if(s===null) continue;
    var e = parseHM(it.end);
    var end = (e===null ? s+60 : e);
    if(now >= s && now < end){ active = {it: it, end: end}; break; }
    if(now < s){ next = it; break; }
  }

  if(active){
    el.className = 'badge is-active';
    el.innerHTML = badgeInner('지금은', active.it.title || '일정', '끝나기까지 ' + fmtLeft(active.end - now), '🎒');
  } else if(next){
    var left = (parseHM(next.start) || 0) - now;
    el.className = 'badge';
    el.innerHTML = badgeInner('다음은', next.title || '일정', fmtClock(next.start) + ' · ' + fmtLeft(left) + ' 뒤', '⏰');
  } else {
    var tm = tomorrowFirst();
    el.className = 'badge is-free';
    if(tm){
      el.innerHTML = badgeInner('오늘 학원 끝!', tm.title || '일정', '내일 ' + fmtClock(tm.start) + '에 시작해요', '🎉');
    } else {
      el.innerHTML = badgeInner('오늘 학원 끝!', '자유 시간', '푹 쉬어 🎉', '🎉');
    }
  }
}

/* ================= 별 · 진화 ================= */
function burstAt(el){
  try{
    var r = el.getBoundingClientRect();
    var cx = r.left + r.width/2;
    var cy = r.top + r.height/2;
    var layer = $('#fx');
    var icons = ['💜','💖','✨','💫','⭐'];
    for(var i=0;i<10;i++){
      var p = document.createElement('span');
      p.className = 'spark';
      p.textContent = icons[i % icons.length];
      p.style.left = (cx - 9) + 'px';
      p.style.top = (cy - 9) + 'px';
      p.style.setProperty('--dx', (Math.random()*170 - 85).toFixed(0) + 'px');
      p.style.setProperty('--dy', (-40 - Math.random()*110).toFixed(0) + 'px');
      layer.appendChild(p);
      (function(node){ setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 950); })(p);
    }
  }catch(e){}
}

function addStars(n, originEl){
  var prev = stageInfo(state.stars).index;
  state.stars += n;
  state.starsToday += n;
  var cur = stageInfo(state.stars).index;
  if(originEl) burstAt(originEl);
  if(cur > prev){
    setTimeout(function(){ celebrate(cur, false); }, 340);
  } else if(cur === EVO.length-1 && state.stars % 5 === 0){
    setTimeout(function(){ celebrate(cur, true); }, 340);
  }
}

function celebrate(stageIdx, bonus){
  var box = $('#party');
  var st = EVO[stageIdx];
  var title = bonus ? ('별 ' + state.stars + '개 돌파!') : ('축하해! ' + st.name + '가 됐어!');
  var sub = bonus ? '별을 계속 모으면 더 반짝반짝해져 ✨' : st.cheer;
  box.innerHTML = '<div class="party-card">'
    + '<div class="party-pet"><img class="petimg" src="' + PET_IMG[stageIdx] + '" alt="' + esc(st.name) + '"></div>'
    + '<div class="party-title">' + esc(title) + '</div>'
    + '<div class="party-sub">' + esc(sub) + '</div>'
    + '<button class="btn primary" data-party-close="1">좋아!</button>'
    + '</div>';
  box.classList.add('show');

  var colors = ['#7C4DFF','#FF5CA8','#C9B3FF','#FFB0D2','#B7F0DC','#FFE08A'];
  var card = box.querySelector('.party-card');
  for(var i=0;i<26;i++){
    var c = document.createElement('i');
    c.className = 'confetti';
    c.style.left = (Math.random()*100) + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random()*0.7) + 's';
    c.style.animationDuration = (1.5 + Math.random()*0.9) + 's';
    card.appendChild(c);
  }
  clearTimeout(celebrate._t);
  celebrate._t = setTimeout(closeParty, 6500);
}
function closeParty(){
  var box = $('#party');
  clearTimeout(celebrate._t);
  box.classList.remove('show');
  box.innerHTML = '';
}

function toast(msg){
  var el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

/* ================= 할 일 ================= */
function toggleTodo(id, el){
  var t = null;
  for(var i=0;i<state.todos.length;i++){ if(state.todos[i].id===id) t = state.todos[i]; }
  if(!t) return;
  t.done = !t.done;
  if(t.done){
    addStars(1, el);
  } else {
    state.stars = Math.max(0, state.stars - 1);
    state.starsToday = Math.max(0, state.starsToday - 1);
  }
  save();
  renderTodos();
  renderPet();
}

function delTodo(id){
  state.todos = state.todos.filter(function(t){ return t.id !== id; });
  save();
  renderTodos();
}

/* 한 번 더 눌러야 지워져요 (손가락이 미끄러져도 괜찮게) */
var armedDelId = null;
function askDelete(btn){
  var id = btn.getAttribute('data-todo-del');
  if(armedDelId === id){
    armedDelId = null;
    delTodo(id);
    return;
  }
  armedDelId = id;
  renderTodos();
  var b = null;
  try{ b = document.querySelector('[data-todo-del="' + id + '"]'); }catch(e){}
  if(b){ b.textContent = '정말?'; b.classList.add('armed'); }
  clearTimeout(askDelete._t);
  askDelete._t = setTimeout(function(){
    if(armedDelId === id){ armedDelId = null; renderTodos(); }
  }, 2600);
}

function addTodo(){
  var inp = $('#todoInput');
  var v = (inp.value || '').trim();
  if(!v){ try{ inp.focus(); }catch(e){} return; }
  if(state.todos.length >= 12){ toast('할 일은 12개까지만 담을 수 있어요'); return; }
  state.todos.push({id:uid(), text:v.slice(0,40), done:false});
  inp.value = '';
  save();
  renderTodos();
  renderPet();
}

function resetToday(){
  state.todos.forEach(function(t){ t.done = false; });
  state.starsToday = 0;
  save();
  renderTodos();
  renderPet();
  toast('오늘 할 일을 새로 시작해!');
}

/* ================= 모달 ================= */
function openModal(html){
  $('#modalBox').innerHTML = html;
  $('#modalBack').classList.add('show');
}
function closeModal(){
  $('#modalBack').classList.remove('show');
  $('#modalBox').innerHTML = '';
}

function openEventModal(dayKey, dateStr, itemId){
  var isNew = !itemId;
  var ds = dateStr || dateKey(todayDate());
  var todayStr = dateKey(todayDate());
  var isToday = (ds === todayStr);
  var item;

  if(isNew){
    item = {id:'', start:'16:00', end:'17:00', title:'', memo:'', skip:[], date:''};
  } else {
    item = findItem(dayKey, itemId);
    if(!item) return;
    item.skip = item.skip || [];
  }

  var oneOff = !!item.date;
  var skippedToday = item.skip.indexOf(todayStr) !== -1;
  var todayDay = dayKeyOf(todayDate());
  var canSkip = (dayKey === todayDay) && !oneOff;
  var dObj = new Date(ds.replace(/-/g,'/') + ' 12:00:00');
  var subTxt = DAY_FULL[dayKey] + ' ' + (dObj.getMonth()+1) + '/' + dObj.getDate();

  var html = '<div class="m-head"><h3>' + (isNew ? '일정 추가' : '일정 고치기') + '</h3>'
    + '<button class="m-x" data-close="1" aria-label="닫기">✕</button></div>'
    + '<div class="m-sub">' + esc(subTxt) + '</div>'
    + '<label class="f"><span>무엇을 하나요?</span>'
    + '<input id="fTitle" type="text" maxlength="24" value="' + esc(item.title) + '" placeholder="예) 태권도"></label>'
    + '<div class="f-row">'
    + '<label class="f"><span>시작</span><input id="fStart" type="time" value="' + esc(item.start) + '"></label>'
    + '<label class="f"><span>끝 (몰라도 괜찮아)</span><input id="fEnd" type="time" value="' + esc(item.end) + '"></label>'
    + '</div>'
    + '<label class="f"><span>메모</span>'
    + '<input id="fMemo" type="text" maxlength="30" value="' + esc(item.memo) + '" placeholder="예) 2층 마티스"></label>';

  if(isNew || oneOff){
    html += '<label class="chk"><input type="checkbox" id="fOne"' + (oneOff ? ' checked' : '')
      + '> ' + esc(subTxt) + ' 하루만 (반복 안 함)</label>';
  }
  if(canSkip){
    html += '<label class="chk"><input type="checkbox" id="fSkip"' + (skippedToday ? ' checked' : '')
      + '> 오늘은 이 일정 쉬어요</label>';
  }

  html += '<div class="m-actions">'
    + (isNew ? '' : '<button class="btn danger" id="mDel">삭제</button>')
    + '<button class="btn ghost" data-close="1">취소</button>'
    + '<button class="btn primary" id="mSave">저장</button>'
    + '</div>';

  openModal(html);

  var titleEl = $('#fTitle');
  setTimeout(function(){ try{ titleEl.focus(); }catch(e){} }, 60);

  $('#mSave').onclick = function(){
    var title = (titleEl.value || '').trim() || '일정';
    var start = $('#fStart').value || '09:00';
    var end = $('#fEnd').value || '';
    var memo = ($('#fMemo').value || '').trim();
    var s = parseHM(start);
    var e = parseHM(end);
    if(e !== null && s !== null && e < s){
      toast('끝나는 시간이 시작보다 빨라요');
      return;
    }
    var one = $('#fOne');
    var skipEl = $('#fSkip');

    if(isNew){
      var it = {id:uid(), start:start, end:end, title:title.slice(0,24), memo:memo.slice(0,30), skip:[], date:''};
      if(one && one.checked) it.date = ds;
      (state.schedule[dayKey] = state.schedule[dayKey] || []).push(it);
    } else {
      item.start = start;
      item.end = end;
      item.title = title.slice(0,24);
      item.memo = memo.slice(0,30);
      if(one){
        if(one.checked) item.date = ds;
        else item.date = '';
      }
      if(skipEl){
        item.skip = (item.skip || []).filter(function(x){ return x !== todayStr; });
        if(skipEl.checked) item.skip.push(todayStr);
      }
    }
    save();
    renderAll();
    closeModal();
    toast(isNew ? '일정을 넣었어!' : '일정을 고쳤어!');
  };

  if(!isNew){
    $('#mDel').onclick = function(){
      state.schedule[dayKey] = state.schedule[dayKey].filter(function(x){ return x.id !== item.id; });
      save();
      renderAll();
      closeModal();
      toast('일정을 지웠어');
    };
  }
}

function openNoteModal(){
  var ds = dateKey(todayDate());
  var cur = state.notes[ds] || '';
  openModal('<div class="m-head"><h3>오늘 메모</h3><button class="m-x" data-close="1" aria-label="닫기">✕</button></div>'

    + '<textarea id="noteInput" rows="3" maxlength="80" placeholder="예) 미술 대신 피아노, 4시에 치과">' + esc(cur) + '</textarea></label>'
    + '<div class="m-actions">'
    + '<button class="btn ghost" id="noteClear">지우기</button>'

  };
  $('#noteClear').onclick = function(){
    delete state.notes[ds];
    save(); renderNote(); closeModal();
  };
}

/* ================= 백업 ================= */
function exportJSON(){
  try{
    var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '지아대시보드-' + dateKey(todayDate()) + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      if(a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1200);
    toast('백업 파일을 내려받아요');
  }catch(e){
    toast('백업을 만들지 못했어요');
  }
}

function importJSON(file){
  var r = new FileReader();
  r.onload = function(){
    try{
      var data = JSON.parse(String(r.result));
      state = normalize(data);
      rollover();
      save();
      renderAll();
      toast('백업을 불러왔어!');
    }catch(e){
      toast('이 파일은 읽을 수 없어요');
    }
  };
  r.onerror = function(){ toast('파일을 읽지 못했어요'); };
  r.readAsText(file);
}

function armConfirm(btn, action){
  if(btn.getAttribute('data-armed') === '1'){
    btn.setAttribute('data-armed','0');
    btn.classList.remove('armed');
    btn.textContent = btn.getAttribute('data-label') || btn.textContent;
    action();
    return;
  }
  if(!btn.getAttribute('data-label')) btn.setAttribute('data-label', btn.textContent);
  btn.setAttribute('data-armed','1');
  btn.classList.add('armed');
  btn.textContent = '한 번 더 누르면 돼요';
  clearTimeout(btn._t);
  btn._t = setTimeout(function(){
    btn.setAttribute('data-armed','0');
    btn.classList.remove('armed');
    btn.textContent = btn.getAttribute('data-label');
  }, 3000);
}

/* ================= 보기 전환 ================= */
function setView(v){
  state.view = (v === 'today') ? 'today' : 'week';
  save();
  renderSeg();
  if(state.view === 'today') renderToday();
}

/* ================= 이벤트 ================= */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;

  var addEl = t.closest('[data-add]');
  if(addEl){ openEventModal(addEl.getAttribute('data-add'), addEl.getAttribute('data-date'), null); return; }

  var evEl = t.closest('[data-ev]');
  if(evEl){ openEventModal(evEl.getAttribute('data-day'), evEl.getAttribute('data-date'), evEl.getAttribute('data-ev')); return; }

  var chk = t.closest('[data-check]');
  if(chk){ toggleTodo(chk.getAttribute('data-check'), chk); return; }

  var del = t.closest('[data-todo-del]');
  if(del){ askDelete(del); return; }

  var seg = t.closest('[data-seg]');
  if(seg){ setView(seg.getAttribute('data-seg')); return; }

  var pc = t.closest('[data-party-close]');
  if(pc){ closeParty(); return; }

  var cl = t.closest('[data-close]');
  if(cl){ closeModal(); return; }

  var noteBar = t.closest('#noteBar');
  if(noteBar){ openNoteModal(); return; }
});

$('#btnNote').addEventListener('click', openNoteModal);
$('#btnAddTodo').addEventListener('click', addTodo);
$('#todoInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); addTodo(); }
});
$('#btnResetToday').addEventListener('click', function(){ armConfirm(this, resetToday); });
$('#btnExport').addEventListener('click', exportJSON);
$('#btnImport').addEventListener('click', function(){ $('#fileInput').click(); });
$('#fileInput').addEventListener('change', function(){
  var f = this.files && this.files[0];
  if(f) importJSON(f);
  this.value = '';
});
$('#btnRestore').addEventListener('click', function(){
  armConfirm(this, function(){
    state = fresh();
    save();
    renderAll();
    toast('처음 상태로 돌아왔어!');
  });
});
$('#modalBack').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeModal();
});

/* ================= 시작 ================= */
rollover();
renderAll();

if(!storageOK()){
  document.body.classList.add('no-store');
  setTimeout(function(){ toast('기록은 저장되지 않아요. Safari 주소로 열어 주세요'); }, 1000);
}

var tickCount = 0;
var lastDay = dateKey(todayDate());
setInterval(function(){
  updateClock();
  renderBadge();
  tickCount++;
  var d = dateKey(todayDate());
  if(d !== lastDay){
    lastDay = d;
    rollover();
    renderAll();
    return;
  }
  if(tickCount % 20 === 0 && state.view === 'today'){ renderToday(); }
  if(tickCount % 40 === 0){ renderHeader(); }
}, 1000);

})();
</script>
</body>
</html>
